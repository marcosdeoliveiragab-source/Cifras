<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cifras da Banda</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Modal Admin -->
  <div id="modalAdmin" class="modal-overlay">
    <div class="modal-box">
      <h3>Área Restrita</h3>
      <p>Digite a senha de administrador</p>
      <input type="password" id="inputSenhaAdmin" class="input-moderno" placeholder="••••••••" onkeydown="tratarEnterModal(event)">
      <div class="modal-actions">
        <button class="btn" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="verificarSenhaAdmin()">Entrar</button>
      </div>
    </div>
  </div>

  <header class="navbar">
    <div class="nav-left">
      <button class="icon-btn" onclick="abrirModal()"><span class="material-icons-round">menu</span></button>
      <div class="brand">
        <div class="logo-icon">
          <span class="material-icons-round">music_note</span>
        </div>
        <div class="brand-text">
          <h1>Cifras</h1>
          <span>Repertório da Banda</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container" id="app">
    <p style="text-align: center; margin-top: 50px; color: #6b7280;">Carregando dados...</p>
  </main>

  <script>
    let dadosApp = [];
    let tomAtual = '';
    let conteudoOriginal = '';
    let musicaTomOriginal = '';
    let intervalRolagem = null;
    let tamanhoFonteAtual = 16;
    let termoBuscaAtual = '';

    const NOTAS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    // ============ ADMIN LOGIN ============
    function abrirModal() { document.getElementById('modalAdmin').classList.add('ativo'); document.getElementById('inputSenhaAdmin').focus(); }
    function fecharModal() { document.getElementById('modalAdmin').classList.remove('ativo'); document.getElementById('inputSenhaAdmin').value = ''; }
    function tratarEnterModal(e) { if(e.key === 'Enter') verificarSenhaAdmin(); }
    function verificarSenhaAdmin() {
      if (document.getElementById('inputSenhaAdmin').value === '10022006') {
        sessionStorage.setItem('adminAutenticado', 'true');
        window.location.href = 'admin.html';
      } else {
        alert('Senha incorreta!'); document.getElementById('inputSenhaAdmin').value = '';
      }
    }

    // ============ CARREGAMENTO INTELIGENTE (FIM DO PROBLEMA DE CACHE) ============
    async function carregarDados() {
      const salvoLocalmente = localStorage.getItem('dadosCifras');
      const isAdmin = sessionStorage.getItem('adminAutenticado') === 'true';

      try {
        // Se for admin, prioriza o cache local para ele poder testar as edições antes de enviar o backup.json pro github
        if (isAdmin && salvoLocalmente) {
          dadosApp = JSON.parse(salvoLocalmente);
          navegar();
          return;
        }

        // Para os membros da banda e aparelhos comuns: sempre baixar a versão mais fresca do arquivo, burlando o cache
        const timestampCache = new Date().getTime();
        const resposta = await fetch('backup.json?nocache=' + timestampCache);
        
        if (!resposta.ok) throw new Error('Falha HTTP');
        
        dadosApp = await resposta.json();
        
        // Atualiza a memória do celular com o dado novo, para o caso da internet cair depois
        localStorage.setItem('dadosCifras', JSON.stringify(dadosApp));
        navegar();

      } catch (erro) {
        console.warn('Usando dados offline. Erro ao buscar backup:', erro);
        // Se cair a internet, ele ainda tenta usar o que tem no celular para não deixar a banda na mão
        if (salvoLocalmente) {
          dadosApp = JSON.parse(salvoLocalmente);
          navegar();
        } else {
          document.getElementById('app').innerHTML = '<p style="text-align: center; color: #6b7280; margin-top: 40px;">Sem conexão com a internet e nenhum dado salvo offline.</p>';
        }
      }
    }

    // ============ LÓGICA MUSICAL ============
    function normalizarNota(nota) {
      const mapaBemol = { 'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#' };
      return mapaBemol[nota] || nota;
    }

    function normalizarHtmlLinhas(html) {
      if (!html) return '';
      return html.replace(/<div><br><\/div>/gi, '\n').replace(/<div>/gi, '\n').replace(/<\/div>/gi, '').replace(/<p>/gi, '\n').replace(/<\/p>/gi, '').replace(/<br\s*\/?>/gi, '\n');
    }

    function transporNotaUnica(nota, semitones) {
      let notaNorm = normalizarNota(nota);
      let index = NOTAS.indexOf(notaNorm);
      if (index === -1) return nota;
      let novoIndex = (index + semitones) % 12;
      if (novoIndex < 0) novoIndex += 12;
      return NOTAS[novoIndex];
    }

    function transporElementoAcorde(acordeStr, semitones) {
      return acordeStr.replace(/[A-G][b#]?/g, (m) => transporNotaUnica(m, semitones));
    }

    function transporCifra(texto, semitones) {
      const textoNormalizado = normalizarHtmlLinhas(texto);
      const REGEX_ACORDE_EXATO = /^[A-G][b#]?(?:m|M|maj|min|dim|aug|sus|add|º|°|\+|-)?\d*(?:M|m|maj|b5|#5|b9|#9|\+|-)?(?:\([^\)]+\))?(?:\/[A-G][b#]?)?$/i;
      const AMBIGUOS = new Set(['A', 'E', 'B', 'EM', 'AM']);

      return textoNormalizado.split('\n').map(linha => {
        if (!linha.trim()) return linha;
        const palavras = linha.trim().split(/\s+/);
        let acordesInevitos = 0, acordesAmbiguos = 0, palavrasTextoMúsica = 0;

        palavras.forEach(p => {
          let semHtml = p.replace(/<[^>]*>/g, '');
          let limpo = semHtml.replace(/^[^\w#bº°\+]+|[^\w#bº°\+]+$/gi, '');
          if (!limpo) return;
          if (/^[\d\-|\/\.\,\:\(\)\+º°]+$/.test(limpo) || /^\(?\d+x\)?$/i.test(limpo) || semHtml.endsWith(':')) return;

          const cabecalhos = /^(intro|introdução|passagem|solo|interlúdio|tribal|pausa|cresce|diminui|instrumental|piano|teclado|refrão|ponte|final|verso|cifra|base|parte|dedilhado|batida|riff|outro|vamp|tag)$/i;
          if (cabecalhos.test(limpo)) return;

          if (REGEX_ACORDE_EXATO.test(limpo)) {
            if (AMBIGUOS.has(limpo.toUpperCase())) acordesAmbiguos++; else acordesInevitos++;
          } else palavrasTextoMúsica++;
        });

        const temAcordes = (acordesInevitos + acordesAmbiguos) > 0;
        const eLinhaDeCifra = temAcordes && (palavrasTextoMúsica === 0 || acordesInevitos > palavrasTextoMúsica);

        if (!eLinhaDeCifra) return linha;

        const regexTokens = /(\S+)(\s*)/g;
        return linha.replace(regexTokens, (match, palavra, espacos) => {
          let semHtml = palavra.replace(/<[^>]*>/g, '');
          let limpo = semHtml.replace(/^[^\w#bº°\+]+|[^\w#bº°\+]+$/gi, '');
          const cabecalhos = /^(intro|introdução|passagem|solo|interlúdio|tribal|pausa|cresce|diminui|instrumental|piano|teclado|refrão|ponte|final|verso|cifra|base|parte|dedilhado|batida|riff|outro|vamp|tag)$/i;

          if (REGEX_ACORDE_EXATO.test(limpo) && !cabecalhos.test(limpo) && !semHtml.endsWith(':')) {
            let inicio = palavra.indexOf(limpo);
            let comeco = palavra.substring(0, inicio);
            let fim = palavra.substring(inicio + limpo.length);

            let limpoTransposto = transporElementoAcorde(limpo, semitones);
            let acordeFormatado = `<span class="acorde">${limpoTransposto}</span>`;
            let novaPalavra = comeco + acordeFormatado + fim;

            let diferencaTamanho = limpoTransposto.length - limpo.length;
            let qtdEspacos = espacos.length;
            if (qtdEspacos > 0 && diferencaTamanho > 0) qtdEspacos = Math.max(1, qtdEspacos - diferencaTamanho);

            return novaPalavra + ' '.repeat(qtdEspacos);
          }
          return match;
        });
      }).join('\n');
    }

    function definirTom(novoTom) {
      tomAtual = normalizarNota(novoTom);
      const semitones = calcularDiferenca(musicaTomOriginal, tomAtual);
      const selectTom = document.getElementById('selectTom');
      if (selectTom) selectTom.value = tomAtual;
      const preConteudo = document.getElementById('cifraConteudo');
      if (preConteudo) preConteudo.innerHTML = transporCifra(conteudoOriginal, semitones);
    }

    function alterarTom(semitones) {
      let indexAtual = NOTAS.indexOf(tomAtual);
      if (indexAtual === -1) indexAtual = 0;
      let novoIndex = (indexAtual + semitones) % 12;
      if (novoIndex < 0) novoIndex += 12;
      definirTom(NOTAS[novoIndex]);
    }

    function calcularDiferenca(tomOrig, tomNovo) {
      let idx1 = NOTAS.indexOf(normalizarNota(tomOrig));
      let idx2 = NOTAS.indexOf(normalizarNota(tomNovo));
      if (idx1 === -1 || idx2 === -1) return 0;
      return idx2 - idx1;
    }

    // ============ CONTROLES VISUAIS & ROLAGEM ============
    function alternarRolagem() {
      const btn = document.getElementById('btnRolagem');
      if (intervalRolagem) {
        clearInterval(intervalRolagem); intervalRolagem = null;
        btn.innerHTML = '<span class="material-icons-round" style="font-size:18px">play_arrow</span> Iniciar';
      } else {
        btn.innerHTML = '<span class="material-icons-round" style="font-size:18px">pause</span> Pausar';
        iniciarIntervaloRolagem();
      }
    }

    function iniciarIntervaloRolagem() {
      if (intervalRolagem) clearInterval(intervalRolagem);
      const val = parseInt(document.getElementById('velocidadeRolagem').value);
      const tempoMs = 150 - (val * 1.4); 
      intervalRolagem = setInterval(() => window.scrollBy(0, 1), tempoMs);
    }

    function atualizarVelocidadeRolagem() { if (intervalRolagem) iniciarIntervaloRolagem(); }

    function alterarFonte(delta) {
      tamanhoFonteAtual = Math.max(10, Math.min(45, tamanhoFonteAtual + delta));
      const preConteudo = document.getElementById('cifraConteudo');
      if (preConteudo) preConteudo.style.fontSize = `${tamanhoFonteAtual}px`;
    }

    // ============ ZOOM AUTOMÁTICO ============
    function ajustarZoomAutomatico() {
      const preElement = document.getElementById('cifraConteudo');
      if (!preElement) return;
      let size = 30; 
      preElement.style.fontSize = size + 'px';
      while (preElement.scrollWidth > preElement.clientWidth && size > 10) {
        size -= 1;
        preElement.style.fontSize = size + 'px';
      }
      tamanhoFonteAtual = size; 
    }


    // ============ RENDERIZAÇÃO ============
    function gerarHtmlListaPastas() {
      let pastasFiltradas = dadosApp.map((pasta, index) => ({...pasta, indexOriginal: index}))
                                    .filter(p => p.nome.toLowerCase().includes(termoBuscaAtual));
      let html = pastasFiltradas.map(pasta => `
        <a href="#/pasta/${pasta.indexOriginal}" class="list-card">
          <div class="card-icon folder"><span class="material-icons-round">folder</span></div>
          <div class="card-content">
            <h4>${pasta.nome}</h4>
            <span><span class="material-icons-round" style="font-size: 14px">music_note</span> ${pasta.musicas.length} música(s)</span>
          </div>
          <span class="material-icons-round chevron">chevron_right</span>
        </a>
      `).join('');
      return html || '<p style="color: #6b7280; text-align: center; padding: 20px;">Nenhuma pasta encontrada.</p>';
    }

    function renderizarInicio() {
      let qtdMusicas = 0;
      dadosApp.forEach(p => qtdMusicas += p.musicas.length);

      return `
        <div class="search-container">
          <span class="material-icons-round">search</span>
          <input type="text" placeholder="Buscar por pasta..." oninput="termoBuscaAtual = this.value.toLowerCase(); document.getElementById('listaDinamica').innerHTML = gerarHtmlListaPastas();">
        </div>

        <div class="stats-container">
          <div class="stat-card">
            <span class="material-icons-round icon-bg-folder">folder</span>
            <div class="stat-info"><h3>${dadosApp.length}</h3><span>Pastas</span></div>
          </div>
          <div class="stat-card">
            <span class="material-icons-round icon-bg-music">music_note</span>
            <div class="stat-info"><h3>${qtdMusicas}</h3><span>Músicas</span></div>
          </div>
        </div>

        <h3 class="secao-titulo">Pastas</h3>
        <div class="lista-grid" id="listaDinamica">
          ${gerarHtmlListaPastas()}
        </div>
      `;
    }

    function gerarHtmlListaMusicas(indexPasta) {
      const pasta = dadosApp[indexPasta];
      let musicasFiltradas = pasta.musicas.filter(m => m.titulo.toLowerCase().includes(termoBuscaAtual));
      let html = musicasFiltradas.map(musica => `
        <a href="#/musica/${indexPasta}/${musica.id}" class="list-card">
          <div class="card-icon music"><span class="material-icons-round">music_note</span></div>
          <div class="card-content">
            <h4>${musica.titulo}</h4>
            <span><span class="tag-tom">Tom: ${musica.tom || 'C'}</span></span>
          </div>
          <span class="material-icons-round chevron">chevron_right</span>
        </a>
      `).join('');
      return html || '<p style="color: #6b7280; text-align: center; padding: 20px;">Nenhuma música encontrada.</p>';
    }

    function renderizarPasta(indexPasta) {
      const pasta = dadosApp[indexPasta];
      if (!pasta) return '<p>Pasta não encontrada.</p>';
      return `
        <div class="cabecalho-secao">
          <button class="icon-btn" onclick="window.history.back()"><span class="material-icons-round">arrow_back</span></button>
          <h2>${pasta.nome}</h2>
        </div>
        <div class="search-container">
          <span class="material-icons-round">search</span>
          <input type="text" placeholder="Buscar música nesta pasta..." oninput="termoBuscaAtual = this.value.toLowerCase(); document.getElementById('listaDinamica').innerHTML = gerarHtmlListaMusicas(${indexPasta});">
        </div>
        <div class="lista-grid" id="listaDinamica">
          ${gerarHtmlListaMusicas(indexPasta)}
        </div>
      `;
    }

    function renderizarMusica(indexPasta, idMusica) {
      const musica = dadosApp[indexPasta]?.musicas.find(m => m.id === idMusica);
      if (!musica) return '<p>Música não encontrada.</p>';

      tomAtual = normalizarNota(musica.tom || 'C');
      musicaTomOriginal = tomAtual;
      conteudoOriginal = musica.conteudo;

      const opcoesTom = NOTAS.map(n => `<option value="${n}">${n}</option>`).join('');

      setTimeout(() => { 
        document.getElementById('selectTom').value = tomAtual; 
        definirTom(tomAtual); 
        ajustarZoomAutomatico(); 
      }, 50);

      // NOVO LAYOUT DOS CONTROLES AQUI
      return `
        <div class="cabecalho-secao">
          <button class="icon-btn" onclick="window.history.back()"><span class="material-icons-round">arrow_back</span></button>
          <h2>${musica.titulo}</h2>
        </div>

        <div class="controles-musica-moderno">
          <div class="linha-controles">
            
            <div class="controle-pilula">
              <span class="label">Tom</span>
              <button class="btn-circular" onclick="alterarTom(-1)">-</button>
              <select id="selectTom" class="select-invisivel" onchange="definirTom(this.value)">
                ${opcoesTom}
              </select>
              <button class="btn-circular" onclick="alterarTom(1)">+</button>
            </div>

            <div class="controle-pilula">
              <span class="label">Fonte</span>
              <button class="btn-circular" onclick="alterarFonte(-2)">A-</button>
              <button class="btn-circular" onclick="alterarFonte(2)">A+</button>
            </div>

          </div>

          <div class="controle-rolagem-container">
            <button id="btnRolagem" class="btn-iniciar-rolagem" onclick="alternarRolagem()">
              <span class="material-icons-round" style="font-size:18px">play_arrow</span> Iniciar
            </button>
            <input type="range" id="velocidadeRolagem" class="slider-moderno" min="1" max="100" value="30" oninput="atualizarVelocidadeRolagem()">
          </div>
        </div>

        <pre id="cifraConteudo" style="font-size: ${tamanhoFonteAtual}px;"></pre>
      `;
    }

    function navegar() {
      if (intervalRolagem) { clearInterval(intervalRolagem); intervalRolagem = null; }
      termoBuscaAtual = ''; 
      
      const hash = window.location.hash;
      const app = document.getElementById('app');

      if (!hash || hash === '#/') {
        app.innerHTML = renderizarInicio();
      } else if (hash.startsWith('#/pasta/')) {
        app.innerHTML = renderizarPasta(hash.split('/')[2]);
      } else if (hash.startsWith('#/musica/')) {
        const parts = hash.split('/');
        app.innerHTML = renderizarMusica(parts[2], parts[3]);
      }
    }

    window.addEventListener('hashchange', navegar);
    carregarDados();
  </script>
</body>
</html>
